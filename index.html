<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>SynApps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ef;--ink:#2b2340;--soft:#6d6585;--line:#eadfce}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;
  background-image:radial-gradient(#eadfce 1.2px,transparent 1.2px);background-size:22px 22px}
header{max-width:1000px;margin:0 auto;padding:40px 20px 10px}
h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
h1 span{color:#ff6b5b}
header p{margin:8px 0 0;color:var(--soft);font-size:18px}
main{max-width:1000px;margin:0 auto;padding:20px 20px 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
a.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border:2px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #2b234018}
.art{height:140px;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.art svg{width:112px;height:112px}
.body{padding:14px 18px 18px;flex:1;display:flex;flex-direction:column}
.body h2{margin:0;font-size:23px;line-height:1.1}
.body p{margin:6px 0 12px;color:var(--soft);font-size:15px;line-height:1.35;flex:1}
.go{margin-top:2px;font-weight:800;font-size:15px}
footer{text-align:center;color:var(--soft);font-size:13px;padding:0 20px 30px}
</style>
</head>
<body>
<header>
  <h1>Syn<span>Apps</span></h1>
  <p>De petites applications, simples et gratuites, sur ordinateur comme sur téléphone.</p>
</header>
<main id="apps"></main>
<footer>Aucune publicité. Sans compte, tout reste dans le navigateur de l'appareil ; un compte par e-mail, facultatif, permet de synchroniser et de partager.</footer>

function pix(rows){const h=rows.length,w=rows[0].length;let o=`<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">`;
  rows.forEach((r,y)=>{let x=0;while(x<w){const c=r[x];let n=1;while(x+n<w&&r[x+n]===c)n++;if(C[c])o+=`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${C[c]}"/>`;x+=n}});return o+"</svg>"}

<script>
/* SynApps — nouvelle version disponible ?
   Le navigateur garde une copie des pages (jusqu'à 10 min sur GitHub Pages, parfois bien plus sur iPhone).
   On compare discrètement le code de la page affichée avec celui en ligne ; s'il a changé, on propose
   « Mettre à jour », qui recharge la page en contournant la copie gardée en mémoire. */
(function(){
  if (!/^https?:$/.test(location.protocol)) return;
  var KEY = 'synapps-maj:' + location.pathname, last = 0, shown = false;
  function sig(root){
    var t = '', els = root.querySelectorAll('script:not([src]),style');
    for (var i = 0; i < els.length; i++) if (!els[i].hasAttribute('data-runtime')) t += els[i].textContent;
    var h = 2166136261; for (var j = 0; j < t.length; j++){ h ^= t.charCodeAt(j); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36) + '.' + t.length;
  }
  var mine = sig(document);
  function banner(){
    if (shown || document.getElementById('synappsMaj')) return; shown = true;
    var b = document.createElement('div'); b.id = 'synappsMaj';
    b.setAttribute('style', 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2147483000;background:#25321e;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font:14px/1.3 system-ui,-apple-system,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px)');
    b.innerHTML = '<span>Une nouvelle version est disponible</span><button type="button" style="border:0;border-radius:999px;padding:7px 14px;background:#8fd16a;color:#18240f;font:600 14px system-ui,-apple-system,sans-serif;cursor:pointer">Mettre à jour</button><button type="button" aria-label="Plus tard" style="border:0;background:none;color:#cfd8c6;font-size:18px;cursor:pointer;padding:0 6px">×</button>';
    var bt = b.querySelectorAll('button');
    bt[0].onclick = function(){ location.replace(location.pathname + '?v=' + Date.now().toString(36) + location.hash); };
    bt[1].onclick = function(){ b.remove(); };
    document.body.appendChild(b);
  }
  function check(){
    var now = Date.now(); if (now - last < 5 * 60 * 1000) return; last = now;
    fetch(location.pathname + '?nocache=' + now.toString(36), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : null; }).then(function(html){
      if (!html) return;
      var theirs = sig(new DOMParser().parseFromString(html, 'text/html'));
      if (theirs === mine){ try { sessionStorage.removeItem(KEY); } catch(e){} return; }
      var tried = null; try { tried = sessionStorage.getItem(KEY); } catch(e){}
      if (tried === theirs) return;                    // déjà rechargé pour cette version : pas de boucle
      try { sessionStorage.setItem(KEY, theirs); } catch(e){}
      banner();
    }).catch(function(){});
  }
  // la page vient d'être rechargée par « Mettre à jour » : on nettoie l'adresse
  if (/[?&]v=/.test(location.search)) try { history.replaceState(null, '', location.pathname + location.hash); } catch(e){}
  setTimeout(check, 2500);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
})();
</script>
